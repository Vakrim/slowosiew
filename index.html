<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Słowosiew — filtr polskich słów</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, sans-serif;
    max-width: 700px;
    margin: 2rem auto;
    padding: 0 1rem;
  }
  h1 { font-size: 1.3rem; }
  input {
    width: 100%;
    box-sizing: border-box;
    font-size: 1.1rem;
    padding: 0.5rem;
    font-family: monospace;
  }
  input.invalid { outline: 2px solid #c00; }
  #error { color: #c00; min-height: 1.2em; font-size: 0.9rem; }
  #count { color: #666; font-size: 0.9rem; margin: 0.5rem 0; }
  #results { columns: 3; column-gap: 1.5rem; }
  #results div { break-inside: avoid; padding: 1px 0; }
  @media (max-width: 600px) { #results { columns: 2; } }
</style>
</head>
<body>
<h1>Słowosiew — 10 000 najpopularniejszych polskich rzeczowników</h1>
<p>Wpisz wyrażenie regularne (RegExp), aby filtrować listę rzeczowników (w mianowniku) posortowaną malejąco wg popularności.</p>
<input id="pattern" type="text" placeholder="np. ^nie|^za, .{10,}, ^[aeiouyąęó]" autofocus>
<div id="error"></div>
<div id="count"></div>
<div id="results"></div>

<script src="words.js"></script>
<script src="app.js"></script>
</body>
</html>
